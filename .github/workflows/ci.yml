name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: shellcheck -x -e SC2034 verify.sh contribute.sh lib/*.sh
      - name: Check bash syntax
        run: bash -n verify.sh contribute.sh lib/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          for t in tests/test_*.sh; do
            echo "=== $t ==="
            bash "$t"
          done

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          for t in tests/test_*.sh; do
            echo "=== $t ==="
            bash "$t"
          done
